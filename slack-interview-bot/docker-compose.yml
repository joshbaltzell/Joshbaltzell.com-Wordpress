services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quotable
      POSTGRES_PASSWORD: quotable_dev
      POSTGRES_DB: quotable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotable"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://quotable:quotable_dev@postgres:5432/quotable
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source for hot reload in dev
      - ./src:/app/src
      - ./public:/app/public

volumes:
  pgdata:
  redisdata:
